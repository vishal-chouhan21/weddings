<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Ceremony</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Noto+Serif:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="common.css">
  <style>
    .engagement-card {
      background: #0d0505;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Full-screen background image */
    .eng-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .eng-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
    }

    /* Header — "THE UNION" bold centered */
    .eng-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
      position: relative;
      z-index: 3;
    }
    .eng-header .hdr-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: #f1f5f9; text-decoration: none; font-size: 18px;
      background: none; border: none; cursor: pointer;
    }
    .eng-header .hdr-title {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      font-size: 16px;
      color: #f1f5f9;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Center content card */
    .eng-content {
      position: relative;
      z-index: 2;
      margin: 20px 24px 0;
      padding: 40px 28px 36px;
      background: rgba(30, 12, 12, 0.65);
      border: 1px solid rgba(184, 20, 20, 0.15);
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Heart icon */
    .eng-heart {
      width: 48px; height: 48px;
      margin: 0 auto 20px;
    }
    .eng-heart svg {
      width: 100%; height: 100%;
      fill: none; stroke: #b81414; stroke-width: 1.8;
    }

    /* "YOU ARE INVITED TO" */
    .invite-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      color: #b81414;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* Cursive Hindi quote with quotation marks */
    .eng-quote {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(24px, 6.5vw, 30px);
      color: rgba(241, 245, 249, 0.85);
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Small divider line */
    .eng-divider {
      width: 40px;
      height: 1px;
      background: rgba(184, 20, 20, 0.35);
      margin: 0 auto 24px;
    }

    /* "ENGAGEMENT CEREMONY" title */
    .eng-title {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      font-size: clamp(24px, 7vw, 32px);
      color: #f1f5f9;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    /* Description text */
    .eng-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* "DETAILS BELOW" section */
    .details-below {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: auto;
      padding: 32px 24px 20px;
    }
    .details-below .db-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      color: rgba(241, 245, 249, 0.35);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .details-below .db-arrow {
      color: rgba(241, 245, 249, 0.3);
      font-size: 20px;
    }

    /* Bottom nav — 4 items as shown in screenshot */
    .eng-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0 max(16px, env(safe-area-inset-bottom));
      background: rgba(10, 5, 5, 0.95);
      border-top: 1px solid rgba(184, 20, 20, 0.1);
      position: relative;
      z-index: 3;
    }
    .eng-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: rgba(148, 163, 184, 0.4);
      font-family: 'Noto Serif', serif;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .eng-nav a i { font-size: 22px; }
    .eng-nav a.active { color: #b81414; }
    .eng-nav a:hover { color: #b81414; }
  </style>
</head>

<body>
  <div class="card-screen engagement-card d-flex flex-column">
    <!-- Background image -->
    <div class="eng-bg"><img src="images/engagement-bg.png" alt=""></div>

    <!-- Header -->
    <div class="eng-header">
      <a href="index.html" class="hdr-btn"><i class="bi bi-arrow-left"></i></a>
      <span class="hdr-title">The Union</span>
      <a href="#" class="hdr-btn"><i class="bi bi-share"></i></a>
    </div>

    <!-- Content Card -->
    <div class="eng-content">
      <!-- Heart -->
      <div class="eng-heart">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>

      <!-- Invite label -->
      <p class="invite-label mb-0">You Are Invited To</p>

      <!-- Quote -->
      <p class="eng-quote mt-3 mb-0">&ldquo;Do dilon ka milan,<br>do parivaron ka<br>bandhan&rdquo;</p>

      <!-- Divider -->
      <div class="eng-divider mt-4"></div>

      <!-- Title -->
      <h1 class="eng-title mb-3">Engagement<br>Ceremony</h1>

      <!-- Description -->
      <p class="eng-desc mb-0">Celebrating the beginning of a<br>beautiful journey together.</p>
    </div>

    <!-- Details Below -->
    <div class="details-below">
      <p class="db-label mb-1">Details Below</p>
      <div class="db-arrow"><i class="bi bi-chevron-down"></i></div>
    </div>

    <!-- Bottom Nav — 4 items matching screenshot -->
    <nav class="eng-nav">
      <a href="index.html"><i class="bi bi-house"></i><span>Home</span></a>
      <a href="engagement.html" class="active"><i class="bi bi-calendar-event"></i><span>Events</span></a>
      <a href="jaimala.html"><i class="bi bi-images"></i><span>Gallery</span></a>
      <a href="#"><i class="bi bi-envelope"></i><span>Contact</span></a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
