<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganpati Darshan - Wedding Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Noto+Serif:wght@400;700&family=Noto+Sans+Devanagari&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="common.css">
  <style>
    .ganesh-card {
      background: linear-gradient(180deg, rgba(184, 20, 20, 0.3) 0%, #211111 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .ambient { position: absolute; inset: 0; opacity: 0.1; overflow: hidden; pointer-events: none; z-index: 0; }
    .ambient .c { position: absolute; border-radius: 50%; }
    .ambient .c1 { width: 256px; height: 256px; top: -88px; left: -39px; border: 2px solid #b81414; }
    .ambient .c2 { width: 256px; height: 256px; top: -44px; left: -19px; border: 4px solid rgba(184,20,20,0.5); }
    .ambient .c3 { width: 320px; height: 320px; bottom: -88px; right: -39px; border: 2px solid #b81414; }
    .ambient .c4 { width: 320px; height: 320px; bottom: -44px; right: -19px; border: 4px solid rgba(184,20,20,0.5); }

    .g-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 8px; position: relative; z-index: 2;
    }
    .g-topbar .close-icon {
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .g-topbar .title {
      font-family: 'Noto Serif', serif; font-weight: 700; font-size: 18px;
      color: #f1f5f9; letter-spacing: -0.27px;
    }

    .g-hero { position: relative; z-index: 1; padding: 16px 24px; }

    .g-img-frame {
      position: relative; width: 100%; aspect-ratio: 4/5;
      border-radius: 24px; border: 4px solid rgba(184,20,20,0.2);
      overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .g-img-frame .glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 256px; height: 320px; background: rgba(184,20,20,0.2);
      border-radius: 9999px; filter: blur(32px); opacity: 0.5; z-index: 1;
    }
    .g-img-frame img {
      position: relative; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: block;
    }

    .g-text {
      position: relative; z-index: 1; padding: 0 24px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .g-text .sanskrit {
      font-family: 'Abril Fatface', 'Noto Sans Devanagari', serif;
      font-size: 36px; letter-spacing: 0.9px; line-height: 45px; text-align: center;
      background: linear-gradient(90deg, #fef08a, #facc15 50%, #ca8a04);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .g-text .translit {
      font-family: 'Noto Serif', serif; font-size: 18px; color: rgba(184,20,20,0.6);
      letter-spacing: 1.8px; text-transform: uppercase; line-height: 28px; text-align: center;
    }
    .g-text .blessing {
      font-family: 'Noto Serif', serif; font-size: 16px; color: #94a3b8;
      line-height: 26px; text-align: center;
    }

    .g-cta {
      position: relative; z-index: 1; display: flex; flex-direction: column;
      align-items: center; padding: 48px 24px; margin-top: auto;
    }
    .g-cta .gold-btn {
      display: flex; align-items: center; justify-content: center;
      height: 56px; min-width: 240px; max-width: 480px; padding: 0 58px;
      background: linear-gradient(90deg, #ca8a04, #facc15 50%, #ca8a04);
      border-radius: 9999px; border: none;
      box-shadow: 0 0 20px rgba(184,20,20,0.3);
      font-family: 'Noto Serif', serif; font-weight: 700; font-size: 18px;
      color: #211111; text-decoration: none; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .g-cta .gold-btn:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(184,20,20,0.5); color: #211111; }

    .g-decor {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; opacity: 0.3; padding-top: 32px;
    }
    .g-decor .dline { width: 48px; height: 1px; background: #b81414; }

    @media (max-width: 359px) {
      .g-text .sanskrit { font-size: 28px; line-height: 36px; }
      .g-text .translit { font-size: 14px; }
      .g-hero { padding: 12px 16px; }
      .g-cta { padding: 32px 16px; }
      .g-cta .gold-btn { padding: 0 40px; font-size: 16px; height: 50px; }
    }
    @media (min-width: 431px) {
      .g-img-frame { max-width: 342px; margin: 0 auto; }
    }
  </style>
</head>

<body>
  <div class="card-screen ganesh-card">
    <div class="ambient"><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div><div class="c c4"></div></div>

    <div class="g-topbar">
      <div class="close-icon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1L13 13M13 1L1 13" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="title">Ganpati Darshan</span>
      <div style="width:48px"></div>
    </div>

    <div class="g-hero">
      <div class="g-img-frame">
        <div class="glow"></div>
        <img src="images/ganesh.png" alt="Lord Ganesh">
      </div>
    </div>

    <div class="g-text">
      <div class="sanskrit">श्री गणेशाय नमः</div>
      <div class="translit">Shri Ganeshaya Namah</div>
      <div class="blessing">Blessings for a new beginning and a divine<br>journey ahead.</div>
    </div>

    <div class="g-cta">
      <a href="engagement.html" class="gold-btn">Know More</a>
      <div class="g-decor">
        <span class="dline"></span>
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none">
          <circle cx="9" cy="10" r="3" stroke="#b81414" stroke-width="1.5" opacity="0.5"/>
          <circle cx="9" cy="10" r="7" stroke="#b81414" stroke-width="1" opacity="0.3"/>
          <circle cx="9" cy="4" r="1.5" fill="#b81414" opacity="0.4"/>
          <circle cx="9" cy="16" r="1.5" fill="#b81414" opacity="0.4"/>
          <circle cx="3" cy="10" r="1.5" fill="#b81414" opacity="0.4"/>
          <circle cx="15" cy="10" r="1.5" fill="#b81414" opacity="0.4"/>
        </svg>
        <span class="dline"></span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
