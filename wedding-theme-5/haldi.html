<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haldi & Mehndi Ceremony</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Noto+Serif:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="common.css">
  <style>
    .haldi-card {
      background: linear-gradient(180deg, #1a0808 0%, #110606 100%);
      min-height: 100vh;
    }

    /* Header — gold/red title */
    .h-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      position: relative;
      z-index: 2;
    }

    .h-header .hbtn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      text-decoration: none;
      font-size: 18px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .h-header .htitle {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      font-size: 16px;
      color: #c44;
      letter-spacing: 0.5px;
    }

    /* Hero card — rounded, with image */
    .h-hero {
      position: relative;
      margin: 0 16px;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/5;
      max-height: 440px;
    }

    .h-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .h-hero .grad {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
    }

    .h-hero .content {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 2;
    }

    .badge-today {
      display: inline-block;
      background: #facc15;
      border: 1px solid rgba(202, 138, 4, 0.4);
      color: #000;
      font-weight: 900;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .h-title {
      font-family: 'Abril Fatface', serif;
      font-size: clamp(26px, 7.5vw, 34px);
      color: #f1f5f9;
      line-height: 1.1;
    }

    .h-loc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: rgba(241, 245, 249, 0.6);
      margin-top: 10px;
    }

    .h-loc i {
      color: #facc15;
      margin-right: 4px;
      font-size: 12px;
    }

    /* Category thumbnails row — rounded rectangles */
    .cat-row {
      display: flex;
      justify-content: space-between;
      padding: 24px 16px 8px;
      gap: 10px;
    }

    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .cat-item .cat-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
    }

    .cat-item .cat-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cat-item .cat-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    /* Section heading with red line */
    .sec-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 20px 16px;
    }

    .sec-head h2 {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      font-size: 22px;
      color: #f1f5f9;
      margin: 0;
      white-space: nowrap;
    }

    .sec-head .sec-line {
      flex: 1;
      height: 1px;
      background: rgba(184, 20, 20, 0.25);
    }

    /* Event detail cards */
    .detail-cards {
      display: flex;
      gap: 12px;
      padding: 0 20px 16px;
    }

    .d-card {
      flex: 1;
      background: rgba(184, 20, 20, 0.06);
      border: 1px solid rgba(184, 20, 20, 0.12);
      border-radius: 16px;
      padding: 18px 16px;
    }

    .d-card .d-icon {
      color: #b81414;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .d-card .d-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      color: rgba(148, 163, 184, 0.5);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .d-card .d-value {
      font-family: 'Noto Serif', serif;
      font-size: 15px;
      color: #f1f5f9;
      font-weight: 700;
      line-height: 1.3;
    }

    /* Gallery section */
    .gallery-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 20px 12px;
    }

    .gallery-head h2 {
      font-family: 'Noto Serif', serif;
      font-weight: 700;
      font-size: 22px;
      color: #f1f5f9;
      margin: 0;
    }

    .gallery-head .view-all {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      color: #b81414;
      text-decoration: none;
      font-weight: 600;
    }

    .gallery-grid {
      display: flex;
      gap: 10px;
      padding: 0 20px 24px;
    }

    .gallery-grid img {
      flex: 1;
      min-width: 0;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
    }

    /* Bottom nav — 4 items */
    .h-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 max(14px, env(safe-area-inset-bottom));
      background: rgba(10, 5, 5, 0.95);
      border-top: 1px solid rgba(184, 20, 20, 0.1);
      position: sticky;
      bottom: 0;
      z-index: 10;
      margin-top: auto;
    }

    .h-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: rgba(148, 163, 184, 0.4);
      font-family: 'Noto Serif', serif;
      font-size: 10px;
      transition: color 0.2s;
    }

    .h-nav a i {
      font-size: 20px;
    }

    .h-nav a.active,
    .h-nav a:hover {
      color: #b81414;
    }

    @media (max-width: 359px) {
      .cat-item .cat-img {
        width: 60px;
        height: 60px;
      }

      .h-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="card-screen haldi-card">
    <!-- Header -->
    <div class="h-header">
      <a href="mata-pujan.html" class="hbtn"><i class="bi bi-arrow-left"></i></a>
      <span class="htitle">Haldi & Mehndi</span>
      <a href="#" class="hbtn"><i class="bi bi-share"></i></a>
    </div>

    <!-- Hero card with rounded corners -->
    <div class="h-hero">
      <img src="images/mehandi.png" alt="Haldi & Mehndi">
      <div class="grad"></div>
      <div class="content">
        <span class="badge-today">Today's Event</span>
        <h1 class="h-title">Haldi aur<br>Mehndi ki<br>Rangin Shaam</h1>
        <p class="h-loc"><i class="bi bi-geo-alt-fill"></i> Royal Orchid Gardens, Jaipur</p>
      </div>
    </div>

    <!-- Category thumbnails — rounded rectangles -->
    <div class="cat-row">
      <div class="cat-item">
        <div class="cat-img"><img src="images/mehandi.png" alt="Moments"></div>
        <span class="cat-label">Moments</span>
      </div>
      <div class="cat-item">
        <div class="cat-img"><img src="images/diya.png" alt="Rituals"></div>
        <span class="cat-label">Rituals</span>
      </div>
      <div class="cat-item">
        <div class="cat-img"><img src="images/jaymala.png" alt="Mehndi Art"></div>
        <span class="cat-label">Mehndi Art</span>
      </div>
      <div class="cat-item">
        <div class="cat-img"><img src="images/location.png" alt="Decor"></div>
        <span class="cat-label">Decor</span>
      </div>
    </div>

    <!-- Event Details -->
    <div class="sec-head">
      <h2>Event Details</h2>
      <div class="sec-line"></div>
    </div>

    <div class="detail-cards">
      <div class="d-card">
        <div class="d-icon"><i class="bi bi-clock"></i></div>
        <div class="d-label">Time</div>
        <div class="d-value">04:00 PM<br>onwards</div>
      </div>
      <div class="d-card">
        <div class="d-icon"><i class="bi bi-person-arms-up"></i></div>
        <div class="d-label">Dress Code</div>
        <div class="d-value">Yellow & Festive</div>
      </div>
    </div>

    <!-- Gallery -->
    <div class="gallery-head">
      <h2>Gallery</h2>
      <a href="#" class="view-all">View All</a>
    </div>

    <div class="gallery-grid">
      <img src="images/mehandi.png" alt="Marigold Flowers">
      <img src="images/vivah.png" alt="Ceremony">
      <img src="images/mehandi.png" alt="Mehndi Hands">
    </div>

    <!-- Bottom Nav — 4 items -->
    <nav class="h-nav">
      <a href="engagement.html" class="active"><i class="bi bi-calendar-event"></i><span>Events</span></a>
      <a href="jaimala.html"><i class="bi bi-images"></i><span>Gallery</span></a>
      <a href="#"><i class="bi bi-heart"></i><span>Wishes</span></a>
      <a href="#"><i class="bi bi-list"></i><span>Menu</span></a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
