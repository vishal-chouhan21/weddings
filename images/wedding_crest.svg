<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="25%" stop-color="#dfb75c" />
      <stop offset="50%" stop-color="#f5e0a0" />
      <stop offset="75%" stop-color="#b8892e" />
      <stop offset="100%" stop-color="#845f1b" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecd18f" />
      <stop offset="50%" stop-color="#fff8e7" />
      <stop offset="100%" stop-color="#caa043" />
    </linearGradient>
    <radialGradient id="crestBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f5ede0" />
    </radialGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a1410" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="200" cy="200" r="185" fill="url(#crestBg)" stroke="url(#goldLuxury)" stroke-width="3" filter="url(#royalGlow)" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="url(#goldLuxury)" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#goldLuxury)" stroke-width="0.75" opacity="0.5" />

  <!-- Botanical Laurel Wreath Left -->
  <g stroke="url(#goldLuxury)" fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M 120 280 C 85 240, 85 155, 128 105" />
    <!-- Leaves Left -->
    <path d="M 120 270 Q 105 260 106 250 Q 115 258 120 270 Z" fill="url(#goldLuxury)" />
    <path d="M 108 245 Q 92 238 95 227 Q 104 233 108 245 Z" fill="url(#goldLuxury)" />
    <path d="M 98 215 Q 82 208 86 197 Q 95 203 98 215 Z" fill="url(#goldLuxury)" />
    <path d="M 94 185 Q 80 176 86 166 Q 94 172 94 185 Z" fill="url(#goldLuxury)" />
    <path d="M 97 155 Q 85 144 93 135 Q 100 142 97 155 Z" fill="url(#goldLuxury)" />
    <path d="M 109 130 Q 100 117 110 110 Q 116 118 109 130 Z" fill="url(#goldLuxury)" />
    <path d="M 128 105 Q 124 92 136 88 Q 139 98 128 105 Z" fill="url(#goldLuxury)" />
  </g>

  <!-- Botanical Laurel Wreath Right -->
  <g stroke="url(#goldLuxury)" fill="none" stroke-width="1.5" stroke-linecap="round">
    <path d="M 280 280 C 315 240, 315 155, 272 105" />
    <!-- Leaves Right -->
    <path d="M 280 270 Q 295 260 294 250 Q 285 258 280 270 Z" fill="url(#goldLuxury)" />
    <path d="M 292 245 Q 308 238 305 227 Q 296 233 292 245 Z" fill="url(#goldLuxury)" />
    <path d="M 302 215 Q 318 208 314 197 Q 305 203 302 215 Z" fill="url(#goldLuxury)" />
    <path d="M 306 185 Q 320 176 314 166 Q 306 172 306 185 Z" fill="url(#goldLuxury)" />
    <path d="M 303 155 Q 315 144 307 135 Q 300 142 303 155 Z" fill="url(#goldLuxury)" />
    <path d="M 291 130 Q 300 117 290 110 Q 284 118 291 130 Z" fill="url(#goldLuxury)" />
    <path d="M 272 105 Q 276 92 264 88 Q 261 98 272 105 Z" fill="url(#goldLuxury)" />
  </g>

  <!-- Geometric Diamond Ring -->
  <polygon points="200,68 310,178 200,288 90,178" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" opacity="0.6" />
  <polygon points="200,74 304,178 200,282 96,178" fill="none" stroke="url(#goldLuxury)" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4" />

  <!-- Center Decorative Crown / Trellis Star -->
  <path d="M 200 82 L 203 92 L 213 95 L 203 98 L 200 108 L 197 98 L 187 95 L 197 92 Z" fill="url(#goldLuxury)" />
  <circle cx="200" cy="95" r="1.5" fill="#ffffff" />

  <!-- Monogram Initials -->
  <text x="168" y="198" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', serif" font-size="78" font-weight="600" font-style="italic" fill="url(#goldLuxury)" text-anchor="middle">K</text>
  <text x="200" y="190" font-family="'Italianno', 'Playfair Display', serif" font-size="44" font-style="italic" fill="#aa7c11" text-anchor="middle">&amp;</text>
  <text x="232" y="198" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', serif" font-size="78" font-weight="600" font-style="italic" fill="url(#goldLuxury)" text-anchor="middle">I</text>

  <!-- Bottom Ribbon / Date -->
  <line x1="140" y1="230" x2="260" y2="230" stroke="url(#goldLuxury)" stroke-width="1" />
  <circle cx="200" cy="230" r="3" fill="url(#goldLuxury)" />
  <text x="200" y="248" font-family="'Cinzel', 'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#6d5420" text-anchor="middle">OCTOBER 19 • 2027</text>
  <text x="200" y="264" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3" fill="#9e7e38" text-anchor="middle">THE WHITE CHURCH</text>
</svg>